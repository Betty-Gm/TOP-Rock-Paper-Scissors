<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>

    <h2>Rock-Paper-Scissors</h2>
    <button class="choice-btn" id="rock-btn">Rock</button>
    <button class="choice-btn" id="paper-btn">Paper</button>
    <button class="choice-btn"id="scissor-btn">Scissors</button>

    <div id="div"></div>

    <div id="score-div">

        <p>Human Score: <span id="human-score">0</span></p>
        <p>Computer Score: <span id="computer-score">0</span></p>
    </div>
    <div id="results-div"></div>

    <button id="reset-btn">Play Again</button>
    <script src="script.js" style="display: none;"></script>
    
</body>
</html>
